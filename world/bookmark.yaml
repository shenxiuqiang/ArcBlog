kind: Bookmark
fields:
  slug: string
  title: string
  addedAt: datetime
# REQ-028 pilot: a reader's private reading list.
#
# This is the first ArcBlog record with a USER-scope home — it is deliberately
# NOT under /instance/app/arcblog/. Storage is the caller-scoped DID Space user
# fragment (measured, ARC 2.0.0-beta.50):
#   /user/arcblog/bookmarks/<slug>.json                          (session view)
#   /blocklets/arcblog/users/<did>/arcblog/bookmarks/<slug>.json (same directory,
#                                                                 root AFS view)
#
# Authorization comes from the SESSION, not from blocklet.yaml: `/user` is the
# caller's own projection, so there is no `replicated` collection to declare and
# nothing to widen. A signed-out caller has no `/user` view at all (404), and a
# second DID resolves the same AFS path to its own, different directory — see
# docs/team/requirements/REQ-028-arc-space-integration.md §7.1.
#
# Written by: the `?page=saved` form (exec /.actions/write) and
# `node scripts/arcblog-bookmarks.mjs add --user <did> --slug <slug>`.
