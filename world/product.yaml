kind: Product
fields:
  id: string
  creatorDid: string
  type: string # article | membership | digital | subscription (spec §41)
  contentId: string
  priceAmount: string
  priceAsset: string
  visibility: string # public | private
  settlementPolicy: string
  periodDays: number # subscription period (spec §38); manual renewal = a new order, no auto-billing
  createdAt: datetime
  updatedAt: datetime
