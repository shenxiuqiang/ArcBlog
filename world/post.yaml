kind: Post
fields:
  title: string
  slug: string
  summary: string
  body: markdown
  coverImage: string
  images: json
  tags: json
  category: string
  status: string # draft | published | archived | deleted
  authorDid: string
  authorName: string
  seoTitle: string
  seoDescription: string
  ogTitle: string
  ogDescription: string
  ogImage: string
  published: boolean
  publishedAt: datetime
  archivedAt: datetime
  deletedAt: datetime
  createdAt: datetime
  updatedAt: datetime
  version: number
  contentHash: string # sha256:<hex> over normalized content (spec §66)
  visibility: string # public | paid (spec §21; paid strips body from the public record)
  productId: string # spec §45: the price lives on the Product, never on the post
  previewOnly: boolean # true on the public copy of a paid post (spec §24)
