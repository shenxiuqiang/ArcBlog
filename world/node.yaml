kind: NodeProfile
fields:
  name: string
  description: string
  avatar: string
  ogImage: string # default share-card image (spec §15.5); posts override per-article
  did: string
  endpoint: string
  roles: json # basic | studio (spec §7; concept v2)
  capabilities: json # spec §11 capability list
  version: string
  protocolVersion: string
  createdAt: datetime
  updatedAt: datetime
