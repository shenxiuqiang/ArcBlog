specVersion: 2
id: arcblog
name: ArcBlog
did: did:blocklet:arcblog
version: 0.3.7
description: "A DID-native publishing space for readable Markdown posts and images."

# Pretty URLs for the reader page: /posts/<slug> resolves the post record and
# renders the `reader` page (see .aup/app.aup), same pattern as discuss-kit.
sites:
  - name: arcblog
    domains:
      - arcblog.localhost
    bindings:
      - id: posts-list
        path: "/posts"
        afs: "/instance/app/arcblog/posts"
        page: posts
      - id: post-reader
        path: "/posts/{slug}"
        afs: "/instance/app/arcblog/posts/{slug}.json"
        page: reader
      - id: draft-preview
        path: "/preview/{slug}"
        afs: "/instance/app/arcblog/drafts/{slug}.json"
        page: preview
      - id: draft-edit
        path: "/edit/{slug}"
        afs: "/instance/app/arcblog/drafts/{slug}.json"
        page: compose-edit

# `scope: app` — per-session /instance overlay so the blocklet can write shared
# content under /instance/app/arcblog (same model as discuss-kit).
scope: app

# Anonymous read access for the public feed: the posts page renders an afs-list
# over published records without a session. drafts/ (draft + archived + deleted)
# is admin-only — the studio lists it, anonymous readers cannot.
networkRead:
  - path: /instance/app/arcblog/posts
    role: guest
  - path: /instance/app/arcblog/drafts
    role: admin
  - path: /instance/app/arcblog/heroes
    role: guest
  # spec §109: a node's identity/roles/capabilities are public network metadata.
  - path: /instance/app/arcblog/node
    role: guest
  # spec §12 /content/categories: public taxonomy used by the reader filters.
  - path: /instance/app/arcblog/categories
    role: guest
  # spec §12 /content/media: upload index; admin-only (it exposes upload paths).
  - path: /instance/app/arcblog/media
    role: admin
  # `networkRead` is a PREFIX grant (ARC launch-kit §"Network-read allowance"): a
  # guest grant on a parent exposes the whole subtree, INCLUDING the directory
  # listing of admin-only children — measured: a guest could list
  # config/agent-grants/ and see the file ids of capability grants. The documented
  # pattern is to gate the whole tree and never nest a public child under a private
  # parent. config/ therefore holds no public surface at all: roles and trusted Hub
  # keys are read by the CLI and by admin-only pages (the dashboard is behind the
  # sign-in gate), so the whole prefix stays admin.
  - path: /instance/app/arcblog/config
    role: admin
  # spec §50: economic transparency — the split policy is public; orders,
  # settlements and the ledger stay admin-only (they name buyers).
  - path: /instance/app/arcblog/economy/policies
    role: guest
  - path: /instance/app/arcblog/economy/products
    role: guest
  - path: /instance/app/arcblog/economy/orders
    role: admin
  - path: /instance/app/arcblog/economy/settlements
    role: admin
  - path: /instance/app/arcblog/economy/ledger
    role: admin
  - path: /instance/app/arcblog/economy/access-grants
    role: admin
  # Attribution proofs are evidence for settlement (admin-only); trusted Hub
  # public keys are public by definition.
  - path: /instance/app/arcblog/economy/attributions
    role: admin
  # spec §71: Studio→Hub registrations are this node's own bookkeeping (DID +
  # endpoint + sync state). The public discovery surface is node/discovery.json,
  # so the registrations stay admin (nothing guest-facing reads them).
  - path: /instance/app/arcblog/hub
    role: admin

# Collection declarations authorize admin writes from the UI (the compose
# form's exec `/.actions/write`) to the record directories — plain base-path
# writes from network clients are denied otherwise. copy: none keeps records
# single-file in the instance space (no per-user mirrors).
replicated:
  posts:
    canonical: instance/app/arcblog/posts/*
    copy: none
    minRole: admin
    readRole: guest
  drafts:
    canonical: instance/app/arcblog/drafts/*
    copy: none
    minRole: admin
    readRole: admin
  heroes:
    canonical: instance/app/arcblog/heroes/*
    copy: none
    minRole: admin
    readRole: guest
  # spec §12: /arcblog/node/{profile,identity,capabilities} — public metadata,
  # admin-writable (node identity/roles are operator-controlled).
  node:
    canonical: instance/app/arcblog/node/*
    copy: none
    minRole: admin
    readRole: guest
  # spec §12: /arcblog/content/categories — operator-managed taxonomy.
  categories:
    canonical: instance/app/arcblog/categories/*
    copy: none
    minRole: admin
    readRole: guest
  # spec §12: /arcblog/content/media — upload index (admin-only reads).
  media:
    canonical: instance/app/arcblog/media/*
    copy: none
    minRole: admin
    readRole: admin
  # spec §9: externalized role/NFT configuration (operator-managed).
  config:
    canonical: instance/app/arcblog/config/*
    copy: none
    minRole: admin
    # guest on the PARENT prefix also exposes the directory listing of nested
    # admin-only collections (measured: a guest could list config/agent-grants and
    # read the grant file ids), so the whole tree is admin — the documented ARC
    # pattern is to gate the tree and never nest a public child under a private
    # parent.
    readRole: admin
  # spec §29/§41/§42/§91: economy records. The policy is public (transparency),
  # everything naming a buyer stays admin-only.
  economy-policy:
    canonical: instance/app/arcblog/economy/policies/*
    copy: none
    minRole: admin
    readRole: guest
  economy-products:
    canonical: instance/app/arcblog/economy/products/*
    copy: none
    minRole: admin
    readRole: guest
  economy-orders:
    canonical: instance/app/arcblog/economy/orders/*
    copy: none
    minRole: admin
    readRole: admin
  economy-settlements:
    canonical: instance/app/arcblog/economy/settlements/*
    copy: none
    minRole: admin
    readRole: admin
  economy-ledger:
    canonical: instance/app/arcblog/economy/ledger/*
    copy: none
    minRole: admin
    readRole: admin
  economy-access-grants:
    canonical: instance/app/arcblog/economy/access-grants/*
    copy: none
    minRole: admin
    readRole: admin
  # spec §30–§33: discovery proofs and the Hub keys needed to verify them.
  economy-attributions:
    canonical: instance/app/arcblog/economy/attributions/*
    copy: none
    minRole: admin
    readRole: admin
  config-trusted-hubs:
    canonical: instance/app/arcblog/config/trusted-hubs/*
    copy: none
    minRole: admin
    readRole: admin
  config-agent-grants:
    canonical: instance/app/arcblog/config/agent-grants/*
    copy: none
    minRole: admin
    readRole: admin
  # spec §70/§71: Studio -> Hub registrations (public network topology).
  hub-registrations:
    canonical: instance/app/arcblog/hub/registrations/*
    copy: none
    minRole: admin
    readRole: admin
