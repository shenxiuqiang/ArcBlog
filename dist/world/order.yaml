kind: Order
fields:
  id: string
  kind: string # purchase | tip (spec §36)
  buyerDid: string
  creatorDid: string
  hubDid: string
  productId: string
  contentId: string # carried from the product; used for attribution matching
  amount: string
  asset: string
  status: string # pending | paid | failed | refunded (spec §42)
  paymentAdapter: string
  paymentRef: string
  paidAt: datetime
  settlementVersion: string
  settledAt: datetime
  createdAt: datetime
  updatedAt: datetime
