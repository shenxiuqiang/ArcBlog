kind: Settlement
fields:
  orderId: string
  orderKind: string # purchase | tip
  contentId: string
  hubShareWithheld: boolean # true when the hub DID had no verified proof (spec §30)
  attributionId: string
  creatorDid: string
  hubDid: string
  asset: string
  amount: string
  creatorAmount: string
  hubAmount: string
  protocolAmount: string
  policyVersion: string
  status: string # settled | reversed (spec §43/§90)
  transactionHash: string
  reversedAt: datetime
  createdAt: datetime
  updatedAt: datetime
