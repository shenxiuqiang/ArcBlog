schemaVersion: 1
page: diagnostics
description: >-
  Health surface for this ArcBlog instance: the verdict of the last recorded
  self-check (scripts/arcblog-doctor.mjs --record) and every recorded check one
  row at a time, with the operational command inventory, the log surface, the
  export / backup path, the permission surface, the background chain-intent queue
  and first-line troubleshooting folded into a single Advanced tab.
synopsis: >-
  Prototype P5 (operations, docs/ArcBlog-admin-ui-design.md §2.7.1): answer "is
  this node healthy right now" — the last recorded self-check verdict, when it
  ran, and every check one row each — and fold all level-3 detail (commands,
  storage / index internals, logs, export / backup, the permission surface, the
  background intent queue, troubleshooting) into one Advanced tab (§2.7.3). The
  page executes nothing: it visualises AFS records and offers copy-and-run
  commands only (§2.7.4 / §8), and it shows "no snapshot yet" instead of a
  fabricated verdict.
flows:
  - Read the summary record under config/diagnostics/summary and the per-check
    records under config/diagnostics/checks (both written by doctor --record).
  - Show overall ok / count / failed / warnings and the recorded-at time.
  - Show every recorded check as one row: id, severity, ok, detail, ranAt.
  - Copy the operator commands: self-check record, storage audit and repair,
    daemon logs, mirror export, guest permission matrix, chain-intent worker.
  - Show "no snapshot yet" instead of inventing a verdict when nothing was
    recorded — empty is not the same as all checks passed.
  - Read the background chain-intent queue: a console chain button only writes an
    intent record, the node's own worker signs it on the chain.
