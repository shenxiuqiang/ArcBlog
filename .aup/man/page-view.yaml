schemaVersion: 1
page: page-view
description: >-
  The public reader for one static page record: `/pages/<slug>` renders whatever the page record
  holds, at this node's own appearance.
synopsis: >-
  The record is bound to the address, so the content is here on the FIRST load (no reload needed —
  see the cold-start channel in the runtime notes). Offline pages are not served; a missing record
  is not-found. Editing happens in the console (`?page=pages`), never here.
flows:
  - Open /pages/<slug> to read the published page.
  - Use the back link to return to the latest stories.
  - Edit the record in the console (pages) — this surface is read-only.
