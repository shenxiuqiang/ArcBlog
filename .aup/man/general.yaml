schemaVersion: 1
page: general
description: >-
  Instance-level General settings: the site name, language and timezone plus the three
  instance switches. One home for every "where is that switch?" question.
synopsis: >-
  Every field is backed by a record in this blocklet's own `config/general/**` collection, which is
  the same surface the CLI writes (`arcblog-settings.mjs`), so the page and the command line cannot
  disagree. Each control offers only its own record's allowed values, so the page cannot submit an
  out-of-options value; a refused write changes nothing and says so.
flows:
  - Read the current values (site name / language / timezone / switches) from config/general/**.
  - Edit one field and Save; the page writes the record and reports "Setting saved." or a refusal.
  - Read the site-level values the RSS generator and the feed consume.
  - Fall back to the CLI (`node scripts/arcblog-settings.mjs show`) when a script needs the value.
