# Man page for "seo" (spec §15.5) — site distribution settings.
#
# E9 = A (human ruling 2026-10-13): this page owns its OWN records under
# `config/seo/` (`meta-description.json`, `share-image.json`) and shows the node
# identity read-only. It no longer writes `node/profile.json`, so every identity
# field has exactly one writer — the CLI — which is what closed DEF-37 and let
# PRD-SET-02 ("one entry point per field") land.
#
# The previous revision carried a DUPLICATE `refs:` key (the last one wins in
# YAML) whose entries were the pre-rename ids (`console-nav-seo-admin`,
# `console-nav-ops-admin`, `arcblog-seo-admin-card-1-action-3`) — dead references
# inside the published artifact. Removed rather than re-pointed: the page is
# id-less by policy (the console-nav generator emits no explicit ids).
schemaVersion: 1
page: seo
description: >-
  Site distribution defaults: the feed/social description and the default share
  image, stored in this page's own records under config/seo/. The node identity
  (name, description, OG image, endpoint) is displayed read-only here because it
  lives in node/profile.json and only the CLI writes it.
synopsis: >-
  Connect a DID Wallet, edit the two distribution fields and save each one; the
  generated RSS feed reads them (channel description and channel image). To
  change the node identity, run the node CLI instead.
examples:
  - label: Save the site description
    action: click
    target: seo-save
  - label: Save the default share image
    action: click
    target: seo-save
flows:
  - Connect the DID Wallet to establish the operator session.
  - Edit the site description or the share image and save that field.
  - Read the node identity card for the values the CLI owns, and change them with
    `node scripts/arcblog-node.mjs set`.
  - The generated RSS feed picks the description up as its channel
    description and the share image as its channel image.
