page: admin
description: >-
  Wallet-gated Creator Studio for managing draft/published/archived lifecycle,
  plus media stored in the caller's DID Space.
synopsis: >-
  Connect a DID Wallet, inspect your content list, and apply lifecycle actions
  (publish, archive, republish, soft delete) without exposing private records.
examples:
  - label: Create a post
    action: click
    target: arcblog-admin-view-1-view-2-card-1-action-3
flows:
  - Connect the DID Wallet to establish the author session.
  - Review published records (public directory) in the "Published" group.
  - Review draft/archived records (private directory) in the "Drafts & archived" group.
  - Open a published row to read it at `/posts/<slug>`, a draft row to preview it at `/preview/<slug>`.
  - Run quick query actions for `status=published` and `status=archived`.
  - Enter filter values for status/category/tag to segment operational views.
  - Apply lifecycle transitions with optimistic concurrency protection.
  - Open the Markdown editor to create or update a post.
