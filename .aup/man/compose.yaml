schemaVersion: 1
page: compose
description: >-
  DID Wallet-gated writing surface: a self-contained form (no post-editor
  widget) that writes ArcBlog-shaped records directly — drafts to the private
  `/instance/app/arcblog/drafts/`, publishes to the guest-readable
  `/instance/app/arcblog/posts/`.
synopsis: >-
  Prototype P3 (edit). Connect wallet, then work in ONE form card: the
  `Essentials` tab groups the fields (content / category & tags / publish) and
  the folded `Advanced` tab holds the SEO/OG five fields plus the image
  dropzone; a bottom action bar carries "Save draft" (secondary) and "Publish"
  (primary). Both submit buttons exec `/.actions/write` with the collected
  inputs (`${args.*}`) and session identity (`$session.did` /
  `$session.displayName`).
examples:
  - label: Save draft
    action: click
    target: save-draft
  - label: Publish
    action: click
    target: publish-now
flows:
  - Connect the DID Wallet to unlock the editor and media upload.
  - "Essentials tab: title, slug, summary, Markdown body, then the category/tags group and the cover image URL group."
  - "Advanced tab (folded, hidden by default): SEO title/description and OG title/description/image, plus the image dropzone — upload there, then paste the URL into the cover field or the Markdown body."
  - The cover image feeds the story-list card thumbnail and the reader/preview banner.
  - Save draft writes the record to the private drafts directory (preview at /preview/<slug>).
  - Publish writes the record to the public posts directory (readable at /posts/<slug>).
  - Same-slug saves overwrite the existing record (no ifMatch guard in the UI form).
refs:
  actions:
    - id: save-draft
      event: click
    - id: publish-now
      event: click
