schemaVersion: 1
page: dashboard
description: >-
  Operator dashboard for this ArcBlog instance: node identity, roles and
  capabilities from the node profile and the externalized role configuration,
  the category taxonomy, the ANOMALY ZONE (the four node-anomaly classes, each as a
  standing sentence the operator can act on), recent published stories and the newest
  drafts waiting to be finished. The economy surface was removed on 2026-10-01 and the
  agent surface is live (?page=agents), so neither is described as "not yet enabled".
synopsis: >-
  Overview (设计依据 = `docs/03-产品设计/01-控制台骨架与页面族.md` §1–§2): answer "what
  needs me now" in one screen — the anomaly zone first (PRD-OPS-01), then the newest
  drafts waiting to be finished, then the newest published stories — and offer exactly
  one primary action, Write a post (?page=compose). Node, network and registry detail
  belongs to Operations; agent policy belongs to Agents. The landing page shows no
  technical identifier at all (level-3 content).
  2026-10-13 版面（三卡；`docs/04-UI设计规范/01 §1 L7/L8`）：① 异常区 = 标题 + 一句说明 +
  每类一行（级别 / 标题 / 详情 / 去处理）+ 末尾**小字常驻证据行**（`node/anomalies.json`
  的 `stateNote`，经 `node/` 目录 item recipe 打印）；② 待处理草稿（3 条 + 「全部草稿与已发布」
  次操作）；③ 最近发布（5 条）。**删掉的**：独立的「常驻说明」卡、分页 BUG-063 说明段、以及
  原先把 `checkedAt/adapter/stateNote` 当正文展示的「常驻状态」小标题——面向实现的解释
  （平台机制 / BUG 号 / localStorage 键 / CLI 文件名）**不进界面**（`L8`），只进
  `?page=diagnostics` 与 `docs/**`。
flows:
  - Read the node profile written by scripts/arcblog-node.mjs.
  - Read the externalized role configuration and whether chain verification is on
    (scripts/arcblog-roles.mjs); capabilities stay withheld while it is off.
  - Review the category taxonomy written by scripts/arcblog-category.mjs.
  - Open recent published stories.
  - Read the anomaly zone written by scripts/arcblog-anomalies.mjs (four classes:
    identity / read-only exit / chain registry / test residue).
  - Jump to write, studio or appearance settings.
