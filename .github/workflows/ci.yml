# The gates that a plain GitHub runner CAN run, plus the ones that need the ARC dev environment.
#
# Two jobs on purpose (2026-10-13):
#   * `fast`   — 28 of the 32 fast suites. It skips exactly the four that need the ARC **development
#                environment** — the `arc` CLI (`artifact-drift`, `i18n`), a RUNNING instance
#                (`permissions`), or a BUILT `dist/` (`dist-secrets`) — and the run header names them,
#                so a green CI never looks like a clean sweep of the whole tier. The list and each
#                suite's reason live in `scripts/run-tests.mjs` (`DEV_ENV_TESTS` / `DEV_ENV_REASONS`)
#                and are checked from both sides by `arcblog-run-tests.test.mjs`.
#   * `arc`    — the real gates: `arc dsl validate`, the FULL fast tier, and `npm run gate:docs`
#                (its A7 step shells out to `arc <group> --help`). It needs the ARC CLI and a local
#                instance, so it stays OFF until a self-hosted runner is registered. Turn it on by
#                setting the repository variable ARCBLOG_ARC_RUNNER=true.
#
# The live tier is never run here: it mutates a shared instance and takes ~21 minutes (repo rule 3).
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: fast tier (no ARC install needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Fast tier (skips the 4 suites that need the ARC dev environment)
        run: node scripts/run-tests.mjs fast --no-dev-env

  arc:
    name: DSL + docs gates (needs the ARC dev environment)
    if: ${{ vars.ARCBLOG_ARC_RUNNER == 'true' }}
    runs-on: [self-hosted, arc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: AUP DSL validates with no issues
        run: arc dsl validate --json
      - name: Fast tier (all 32 suites)
        run: npm test
      - name: Six document volume gates
        run: npm run gate:docs
      - name: Build + strip non-product files
        run: npm run build
