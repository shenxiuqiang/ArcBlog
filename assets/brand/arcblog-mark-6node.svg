<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="ArcBlog">
  <title>ArcBlog</title>
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" x1="15" y1="10" x2="81" y2="86" id="abGradA">
      <stop offset="0" stop-color="#2BE0DC"/>
      <stop offset="1" stop-color="#0E7C86"/>
    </linearGradient>
  </defs>
  <!-- 连接：六边形网络框 + 六个节点 -->
  <g fill="none" stroke="url(#abGradA)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 10 81 29 81 67 48 86 15 67 15 29Z"/>
  </g>
  <!-- 文章：三行正文（末行短，读起来像段落） -->
  <g fill="none" stroke="url(#abGradA)" stroke-width="4.8" stroke-linecap="round">
    <path d="M27 40h42"/>
    <path d="M23 50h50"/>
    <path d="M31 60h34"/>
  </g>
  <g fill="#1DC1C7">
    <circle cx="48" cy="10" r="3.2"/>
    <circle cx="81" cy="29" r="3.2"/>
    <circle cx="81" cy="67" r="3.2"/>
    <circle cx="48" cy="86" r="3.2"/>
    <circle cx="15" cy="67" r="3.2"/>
    <circle cx="15" cy="29" r="3.2"/>
  </g>
</svg>
