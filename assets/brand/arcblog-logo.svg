<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="ArcBlog">
  <title>ArcBlog</title>
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" x1="15" y1="10" x2="81" y2="86" id="abGradLock">
      <stop offset="0" stop-color="#2BE0DC"/>
      <stop offset="1" stop-color="#0E7C86"/>
    </linearGradient>
  </defs>

  <!-- 连接：六边形网络框 + 六个节点 -->
  <g fill="none" stroke="url(#abGradLock)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 10 81 29 81 67 48 86 15 67 15 29Z"/>
  </g>
  <!-- 文章：三行正文（末行短，读起来像段落） -->
  <g fill="none" stroke="url(#abGradLock)" stroke-width="4.8" stroke-linecap="round">
    <path d="M27 40h42"/>
    <path d="M23 50h50"/>
    <path d="M31 60h34"/>
  </g>
  <g fill="#1DC1C7">
    <circle cx="48" cy="10" r="3.4"/>
    <circle cx="15" cy="67" r="3.4"/>
    <circle cx="81" cy="67" r="3.4"/>
  </g>

  <text x="104" y="62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="0.2" fill="#111111">Arc<tspan fill="#0E7C86">Blog</tspan></text>
</svg>
