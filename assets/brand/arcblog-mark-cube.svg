    <path d="M33 27.5 60 27.5"/>
    <path d="M28 34.5 65 34.5"/>
    <path d="M36 41.5 57 41.5"/>
  </g>
  <!-- 连接：三个交替外节点（网络语义，不抢主体） -->
  <g fill="#1DC1C7">
    <circle cx="48" cy="10" r="3.6"/>
    <circle cx="15" cy="67" r="3.6"/>
    <circle cx="81" cy="67" r="3.6"/>
