    <path d="M48 10 81 29 81 67 48 86 15 67 15 29Z"/>
    <path d="M48 48 15 29M48 48 81 29M48 48V86"/>
  </g>
  <!-- 文章：顶面（N-NE-C-NW 菱形）上的三行，沿面轴等距排布 -->
