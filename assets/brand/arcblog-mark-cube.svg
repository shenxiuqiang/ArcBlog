<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="ArcBlog">
  <title>ArcBlog</title>
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" x1="15" y1="10" x2="81" y2="86" id="abGradB">
      <stop offset="0" stop-color="#2BE0DC"/>
      <stop offset="1" stop-color="#0E7C86"/>
    </linearGradient>
  </defs>
  <!-- 等距立方体（ArcBlock 家族轮廓）：外六边形 + 三条内棱 -->
