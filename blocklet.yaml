specVersion: 2
id: arcblog
name: ArcBlog
did: did:blocklet:arcblog
version: 0.3.7
description: "A DID-native publishing space for readable Markdown posts and images."

# Publishable metadata (manifest groups: identity / metadata / runtime / data).
# Values are facts about this repository: the git remote, the docs tree, and the
# package privacy flag in package.json (no LICENSE file exists yet, so the
# manifest says UNLICENSED rather than inventing a licence).
logo: logo.svg
keywords:
  - blocklet
  - did
  - blog
  - markdown
  - publishing
  - afs
  - aup
  - self-hosted
tags:
  - blog
  - publishing
  - did
  - markdown
author:
  name: shenxiuqiang
  url: https://github.com/shenxiuqiang
copyright:
  owner: ArcBlog
  year: 2026
license: Apache-2.0
homepage: https://github.com/shenxiuqiang/ArcBlog
documentation: https://github.com/shenxiuqiang/ArcBlog/tree/main/docs
support: https://github.com/shenxiuqiang/ArcBlog/issues
repository:
  type: git
  url: https://github.com/shenxiuqiang/ArcBlog

# Platform save capability (bookmark + selection note), OFF (2026-10-13).
#
# WHY: with `save:` omitted the platform treats the blocklet as save-enabled and mounts its own
# chrome — a fixed bottom-right bar with two English buttons ("Bookmark" / "My saves") plus a
# selection popover — for every AUTHENTICATED reader, on every page (human report, twice:
# "右下角显示两个按钮", then still "刷新页面会…显示两个按钮，随后隐藏"). The theme bridge could only
# react to that bar after its own iframe document had loaded, while the bar is mounted by the
# daemon's first `aup` websocket message — measured 2026-10-13 in a real signed-in headless Chrome:
# `__arcSave = "floating"`, `data-arc-save-capability = "floating"` and `[data-arc-save]` PAINTED at
# t = 31 ms, when the bridge had not yet injected any stylesheet. So the bar appeared and was swept a
# moment later — the "appears, then hides" flash, however fast the sweep ran. Declaring the
# capability off is the only form of the fix that applies BEFORE the first paint.
#
# HOW: `save` is a top-level manifest field (boolean, or `{enabled, chrome}`); `false` normalises to
# `{enabled: false, chrome: "floating"}` and stamps `data-arc-save-capability="off"`, which the
# shared save-surface IIFE reads FIRST — no bar and no popover on either face (the web face stamps
# the attribute server-side, the AUP face receives it in `msg.save`). Docs:
# https://www.arcblock.io/zh/docs/web-device/save-capability/ (arc#6715).
# Deliberately NOT `chrome: "buttons"`: that keeps the capability ON and expects the page to author
# its own `[data-arc-save]` controls — i.e. the very chrome this declaration removes.
#
# DOCUMENTED SIDE EFFECT (accepted): the platform's own `/{locale}/my/` page stops listing its
# built-in Bookmarks / Notes sections. ArcBlog's reading list is unaffected — it is a separate,
# repo-owned feature at `/user/arcblog/bookmarks/` (`?page=saved`, `scripts/arcblog-bookmarks.mjs`),
# while the platform's save bar wrote to `/user/bookmarks` via `/.actions/bookmark` — two bookmark
# stores, only one of them ours.
save: false

# Pretty URLs for the reader page: /posts/<slug> resolves the post record and
# renders the `reader` page (see .aup/app.aup), same pattern as discuss-kit.
sites:
  - name: arcblog
    domains:
      - arcblog.localhost
    bindings:
      - id: posts-list
        path: "/posts"
        afs: "/instance/app/arcblog/posts"
        page: index
      - id: post-reader
        path: "/posts/{slug}"
        afs: "/instance/app/arcblog/posts/{slug}.json"
        page: reader
      - id: draft-preview
        path: "/preview/{slug}"
        afs: "/instance/app/arcblog/drafts/{slug}.json"
        page: preview
      - id: draft-edit
        path: "/edit/{slug}"
        afs: "/instance/app/arcblog/drafts/{slug}.json"
        page: compose-edit
      - id: page-view
        path: "/pages/{slug}"
        afs: "/instance/app/arcblog/pages/{slug}.json"
        page: page-view

# `scope: app` — per-session /instance overlay so the blocklet can write shared
# content under /instance/app/arcblog (same model as discuss-kit).
scope: app

# The web surface's public root is `content/` — mapped to the SITE MOUNT, not to `/`:
# a file at `content/media/x.png` answers `/p/media/x.png` at the site root (probed 2026-10-13:
# `/media/x.png` and `/content/media/x.png` return the AUP shell, `/p/media/x.png` returns image/png).
# Because that makes `content/` a collection, `arc blocklet check` asks for this declaration;
# `arc collections scan .` printed exactly this fragment. `type: local:media` also requires
# `schema/media.yaml` (error `content_schema_missing_local_schema` otherwise). Faces are the
# scan defaults: no `mcp` (opt-in only, epic #3657 W2).
collections:
  media:
    type: local:media
    # `arc collections scan .` prints NOTHING today (the directory is gone with the share card
    # below: `content/media/` held only `arcblog-og.png`). Keep the declaration: the
    # collection used to publish the share card (`content/media/arcblog-og.png`, deleted
    # 2026-10-14 — the share card is the platform OG generator now). Keep the declaration as the
    # scan's output: when per-item media pages arrive, `content/media/<slug>/content.md` becomes
    # indexable without touching this file.
    indexable:
      - "content/media/**/content.md"
    faces:
      web: true
      sitemap: true
      llms: [index, full]


# Share-card declaration (2026-10-13). Three layers, all three needed, all three measured:
#   1. `.web/seo/og-image`  — the *file*; the ONLY form `arc blocklet check` credits
#      (`og_image_source_missing` clears). `.web/site.yaml`'s `seo.og-image` does NOT clear it
#      (counter-example: the shipped `nimbus-demo` carries that key and still warns);
#   2. `.web/site.yaml` `seo.*` — what the RUNTIME actually emits (probed build-only: it wins
#      over the file, and `pages/<type>/seo/og-image` wins over both, per page type);
#   3. **the platform's own OG generator** — `/.well-known/service/blocklet/og.png?template=default
#      &title=…&locale=…`, coloured by the console's `passportColor`. 2026-10-14: the baked
#      `content/media/arcblog-og.png` was deleted and BOTH declarations now carry this endpoint
#      (measured: `arc blocklet check` accepts it, and the runtime emits it verbatim — §79).

# Anonymous read access for the public feed: the index page renders an afs-list
# over published records without a session. drafts/ (draft + archived + deleted)
# is admin-only — the studio lists it, anonymous readers cannot.
networkRead:
  - path: /instance/app/arcblog/posts
    role: guest
  - path: /instance/app/arcblog/drafts
    role: admin
  - path: /instance/app/arcblog/heroes
    role: guest
  # spec §109: a node's identity/roles/capabilities are public network metadata.
  # This prefix also carries the public projections node/registry.json (ENG-15)
  # and node/summaries/<id>.json (PRD-AGT-07) — guest-readable by this grant.
  - path: /instance/app/arcblog/node
    role: guest
  # spec §12 /content/categories: public taxonomy used by the reader filters.
  - path: /instance/app/arcblog/categories
    role: guest
  # spec §15.4: the console's tag surface — a DERIVED projection (rebuildable
  # from the posts at any time) plus this node's intent queue. Tags themselves
  # stay on the post records, so there is no registry to expose: admin-only.
  - path: /instance/app/arcblog/tags
    role: admin
  # spec §12 /content/media: upload index; admin-only (it exposes upload paths).
  - path: /instance/app/arcblog/media
    role: admin
  # `networkRead` is a PREFIX grant (ARC launch-kit §"Network-read allowance"): a
  # guest grant on a parent exposes the whole subtree, INCLUDING the directory
  # listing of admin-only children — measured: a guest could list
  # config/agent-grants/ and see the file ids of capability grants. The documented
  # pattern is to gate the whole tree and never nest a public child under a private
  # parent. config/ therefore holds no public surface at all: the role config is
  # read by the CLI and by admin-only pages (the dashboard is behind the
  # sign-in gate), so the whole prefix stays admin.
  - path: /instance/app/arcblog/config
    role: admin
  # spec §15.4: static pages. The same directory-boundary rule as posts —
  # pages/ is online only (guest), page-drafts/ is offline only (admin).
  - path: /instance/app/arcblog/pages
    role: guest
  - path: /instance/app/arcblog/page-drafts
    role: admin

# Collection declarations authorize admin writes from the UI (the compose
# form's exec `/.actions/write`) to the record directories — plain base-path
# writes from network clients are denied otherwise. copy: none keeps records
# single-file in the instance space (no per-user mirrors).
replicated:
  posts:
    canonical: instance/app/arcblog/posts/*
    copy: none
    minRole: admin
    readRole: guest
  drafts:
    canonical: instance/app/arcblog/drafts/*
    copy: none
    minRole: admin
    readRole: admin
  heroes:
    canonical: instance/app/arcblog/heroes/*
    copy: none
    minRole: admin
    readRole: guest
  # /arcblog/node/* — public metadata, admin-writable (node identity/roles are
  # operator-controlled, spec §107–§109): profile/identity, discovery/health,
  # the factories projection, the chain-registry projection
  # (registry.json + registry/<stakeAddress>.json, ENG-15), and the agent
  # aggregation projection (summaries/<id>.json, PRD-AGT-07 — written by
  # scripts/arcblog-summarize.mjs, public fields only).
  #
  # This prefix grant IS the read declaration for node/summaries: a prefix grant
  # covers the whole subtree, and node/ holds no private child, so no nested
  # collection is needed. Measured, not inferred — scripts/arcblog-permissions.test.mjs
  # lists `node/summaries` in its guest-readable public set (R5-a, 2026-10-12).
  node:
    canonical: instance/app/arcblog/node/*
    copy: none
    minRole: admin
    readRole: guest
  # /arcblog/categories — operator-managed taxonomy (spec §12).
  categories:
    canonical: instance/app/arcblog/categories/*
    copy: none
    minRole: admin
    readRole: guest
  # /arcblog/tags — the console's tag surface (spec §15.4). It holds ONLY the
  # derived projection (index.json + items/) and the operator's intent queue
  # (intents/): tags remain free-form fields on posts, and the projection is
  # rebuildable with `node scripts/arcblog-tags.mjs project`. Admin-only, like
  # every other console bookkeeping tree.
  tags:
    canonical: instance/app/arcblog/tags/*
    copy: none
    minRole: admin
    readRole: admin
  # /arcblog/media — upload index, admin-only reads (spec §15.4).
  media:
    canonical: instance/app/arcblog/media/*
    copy: none
    minRole: admin
    readRole: admin
  # The whole config tree is one admin-only collection: roles, content-signing
  # keys, agent grants and the node-NFT records (spec §9/§61/§67).
  # Guest on the PARENT prefix would also expose the directory listing of nested
  # admin-only records (measured: a guest could list config/agent-grants and read
  # the grant file ids), so the tree stays admin — the documented ARC pattern is
  # to gate the tree and never nest a public child under a private parent.
  config:
    canonical: instance/app/arcblog/config/*
    copy: none
    minRole: admin
    readRole: admin
  # spec §15.4: static pages — two states only, stored on two sides of a
  # directory boundary exactly like posts/drafts.
  pages:
    canonical: instance/app/arcblog/pages/*
    copy: none
    minRole: admin
    readRole: guest
  page-drafts:
    canonical: instance/app/arcblog/page-drafts/*
    copy: none
    minRole: admin
    readRole: admin
